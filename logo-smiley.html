<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goodblox — smiley directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08080c; --card:#0f0f15; --line:#1f1f27; --fog:#e8e8ee; --dim:#767682; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1000px 560px at 50% -15%,rgba(255,196,0,.10),transparent 65%),var(--bg);
       color:var(--fog);font-family:Inter,system-ui,sans-serif;padding:52px 24px 90px;}
  .head{text-align:center;margin-bottom:44px;}
  h1{font-size:25px;font-weight:800;letter-spacing:-.4px;color:#fff;margin-bottom:9px;}
  .lead{color:var(--dim);font-size:14.5px;max-width:610px;margin:0 auto;line-height:1.65;}

  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1340px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 26px 22px;position:relative;overflow:hidden;transition:border-color .25s;}
  .card:hover{border-color:#36363f;}
  .glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:240px;height:170px;border-radius:50%;filter:blur(58px);opacity:.20;background:#ffc400;pointer-events:none;}
  .num{position:absolute;top:16px;right:18px;font-size:11px;font-weight:600;color:#4c4c57;letter-spacing:1px;}
  .hero{display:flex;align-items:center;gap:18px;position:relative;margin-bottom:22px;}
  .hero svg{width:80px;height:80px;flex:none;filter:drop-shadow(0 12px 26px rgba(0,0,0,.5));}
  .wm{font-size:30px;font-weight:800;letter-spacing:-1.1px;line-height:1;}
  .sub{margin-top:8px;font-size:13px;font-weight:600;color:#fff;}
  .desc{font-size:12px;color:var(--dim);line-height:1.55;margin-top:3px;max-width:250px;}
  .strip{display:flex;align-items:flex-end;gap:18px;padding-top:20px;margin-top:20px;border-top:1px solid var(--line);}
  .strip figure{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .strip figcaption{font-size:9px;color:#55555f;letter-spacing:.4px;}
  .ctx{display:flex;gap:12px;align-items:center;margin-top:18px;}
  .sq{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .sq.w{background:#fff;} .sq.b{background:#000;border:1px solid #202028;}
  .sq svg{width:36px;height:36px;}
  .tab{display:flex;align-items:center;gap:8px;background:#242430;border-radius:8px 8px 0 0;padding:9px 16px 9px 11px;font-size:12.5px;font-weight:500;color:#e8e8ee;}
  .tab svg{width:16px;height:16px;}
  .pick{margin-top:20px;width:100%;font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.2px;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--fog);cursor:pointer;transition:.2s;}
  .pick:hover{border-color:#ffc400;background:rgba(255,196,0,.10);color:#fff;}
  .note{margin:48px auto 0;font-size:13px;color:var(--dim);max-width:640px;text-align:center;line-height:1.7;}
  .vs{display:flex;gap:14px;justify-content:center;margin-top:22px;}
</style>
</head>
<body>
<div class="head">
  <h1>Goodblox — smiley directions</h1>
  <p class="lead">"Good" = טוב = שמח. הסמיילי מתאים לרשימה ידידותית, מזוהה מיידית גם ב-16px, ומרגיש חם. שישה כיוונים — חלקם שמח, חלקם קול.</p>
</div>
<div class="row" id="row"></div>
<p class="note">תגיד מספר, ואחבר ל-header, לאייקונים, ל-favicon ולגוגל.</p>

<script>
/* ===== yellow palettes ===== */
const Y = {
  sunny:  { g:[[0,'#ffe066'],[.55,'#ffc93c'],[1,'#f5a300']], ink:'#3a2600', glow:'#ffc400' },
  gold:   { g:[[0,'#ffd76e'],[.5,'#f0b429'],[1,'#c98a10']], ink:'#33210a', glow:'#f0b429' },
  lemon:  { g:[[0,'#fff3a8'],[.5,'#ffe14d'],[1,'#f5c400']], ink:'#3d2f00', glow:'#ffe14d' },
};

const gradDef = (uid, arr) => `<linearGradient id="y${uid}" x1=".15" y1="0" x2=".85" y2="1">${arr.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const glossDef = uid => `<radialGradient id="h${uid}" cx=".34" cy=".2" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".6" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;
const innerDef = uid => `<radialGradient id="s${uid}" cx=".7" cy=".82" r=".8"><stop offset="0" stop-color="#b87800" stop-opacity=".30"/><stop offset="1" stop-color="#b87800" stop-opacity="0"/></radialGradient>`;
const star = (cx,cy,R,r) => { let p=''; for(let i=0;i<10;i++){const rad=i%2?r:R,a=Math.PI*i/5-Math.PI/2;p+=`${(cx+rad*Math.cos(a)).toFixed(1)},${(cy+rad*Math.sin(a)).toFixed(1)} `;} return p.trim(); };

/* ===== shared face pieces ===== */
const gloss = uid => `<circle cx="32" cy="32" r="28" fill="url(#h${uid})"/><circle cx="32" cy="32" r="28" fill="url(#s${uid})"/>`;
const dotEyes = ink => `<circle cx="23" cy="27" r="3.6" fill="${ink}"/><circle cx="41" cy="27" r="3.6" fill="${ink}"/>`;
const blush = () => `<ellipse cx="19" cy="37" rx="4.4" ry="2.6" fill="#ff8a5b" opacity=".32"/><ellipse cx="45" cy="37" rx="4.4" ry="2.6" fill="#ff8a5b" opacity=".32"/>`;
const smileArc = ink => `<path d="M21 38 Q32 49 43 38" fill="none" stroke="${ink}" stroke-width="4.6" stroke-linecap="round"/>`;

/* ===== 6 marks ===== */
const MARKS = [
  { key:'classic', name:'Classic', desc:'הסמיילי הקלאסי — עיניים עגולות וחיוך. פשוט, שמח, מוכר לכולם.', pal:'sunny',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <circle cx="32" cy="32" r="28" fill="url(#y${u})"/>
      ${gloss(u)}${dotEyes(p.ink)}${smileArc(p.ink)}</svg>` },

  { key:'blox', name:'Blox Smiley', desc:'אותה דמות על ריבוע מעוגל — רמז לרובלוקס, מרגיש כמו לוגו אמיתי.', pal:'sunny',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <rect x="3" y="3" width="58" height="58" rx="19" fill="url(#y${u})"/>
      <rect x="3" y="3" width="58" height="58" rx="19" fill="url(#h${u})"/>
      <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="18.3" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
      ${dotEyes(p.ink)}${smileArc(p.ink)}${blush()}</svg>` },

  { key:'star', name:'Star Eyes', desc:'עיני כוכב — נרגש, אנרגטי, "משחקים טובים!". בולט מאוד כתוצאה בגוגל.', pal:'lemon',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <circle cx="32" cy="32" r="28" fill="url(#y${u})"/>
      ${gloss(u)}
      <polygon points="${star(23,27,6.4,2.6)}" fill="${p.ink}"/>
      <polygon points="${star(41,27,6.4,2.6)}" fill="${p.ink}"/>
      <path d="M21 39 Q32 50 43 39" fill="none" stroke="${p.ink}" stroke-width="4.6" stroke-linecap="round"/></svg>` },

  { key:'wink', name:'Wink', desc:'קריצה — שובב, בטוח, קצת קול. מרגיש אישי ולא ילדותי.', pal:'sunny',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <circle cx="32" cy="32" r="28" fill="url(#y${u})"/>
      ${gloss(u)}
      <path d="M18.5 27 Q23 23.4 27.5 27" fill="none" stroke="${p.ink}" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="41" cy="27" r="3.6" fill="${p.ink}"/>
      <path d="M21 39 Q32 50 43 38" fill="none" stroke="${p.ink}" stroke-width="4.6" stroke-linecap="round"/></svg>` },

  { key:'cool', name:'Cool', desc:'משקפי שמש — בטוח בעצמו, "אנחנו יודעים מה טוב". בוגר ובוטח.', pal:'gold',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <circle cx="32" cy="32" r="28" fill="url(#y${u})"/>
      ${gloss(u)}
      <rect x="14" y="23" width="15" height="10.5" rx="3.4" fill="${p.ink}"/>
      <rect x="35" y="23" width="15" height="10.5" rx="3.4" fill="${p.ink}"/>
      <path d="M29 27.5 H35" stroke="${p.ink}" stroke-width="2.6"/>
      <path d="M14 27 H10" stroke="${p.ink}" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M50 27 H54" stroke="${p.ink}" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M22 41 Q32 50 42 41" fill="none" stroke="${p.ink}" stroke-width="4.2" stroke-linecap="round"/></svg>` },

  { key:'grin', name:'Big Grin', desc:'חיוך ענק עם שיניים — הכי שמח ובולט. אופטימי וצעיר.', pal:'lemon',
    svg:(p,u)=>`<svg viewBox="0 0 64 64"><defs>${gradDef(u,p.g)}${glossDef(u)}${innerDef(u)}</defs>
      <circle cx="32" cy="32" r="28" fill="url(#y${u})"/>
      ${gloss(u)}${dotEyes(p.ink)}
      <path d="M19 36 Q32 53 45 36 Z" fill="${p.ink}"/>
      <path d="M23.5 36 Q32 39.5 40.5 36 Z" fill="#fff" fill-opacity=".85"/></svg>` },
];

let uid = 0;
const nid = () => 'm' + (uid++);
const render = o => MARKS.find(m=>m.key===o.key).svg(Y[o.pal], nid());
const sized = (o,size) => render(o).replace('<svg ', `<svg width="${size}" height="${size}" `);

document.getElementById('row').innerHTML = MARKS.map((o,i) => {
  const pal = Y[o.pal];
  const g = `linear-gradient(100deg,${pal.g[1][1]},${pal.g[0][1]})`;
  return `
  <div class="card">
    <div class="glow" style="background:${pal.glow}"></div>
    <span class="num">0${i+1}</span>
    <div class="hero">
      ${render(o)}
      <div>
        <div class="wm" style="background:${g};-webkit-background-clip:text;background-clip:text;color:transparent">goodblox</div>
        <div class="sub">${o.name}</div>
      </div>
    </div>
    <div class="desc">${o.desc}</div>
    <div class="strip">
      ${[48,32,16].map(s => `<figure>${sized(o,s)}<figcaption>${s}px</figcaption></figure>`).join('')}
    </div>
    <div class="ctx">
      <span class="sq w">${sized(o,36)}</span>
      <span class="sq b">${sized(o,36)}</span>
      <span class="tab">${sized(o,16)}Goodblox</span>
    </div>
    <button class="pick" data-pick="${i}">בחר ${o.name}</button>
  </div>`;
}).join('');

document.getElementById('row').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b) alert('בחרת: ' + MARKS[b.dataset.pick].name);
});
</script>
</body>
</html>
