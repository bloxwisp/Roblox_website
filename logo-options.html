<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goodblox — logo options</title>
<style>
  :root{ --bg:#0a0912; --panel:#14111f; --signal:#f4e04d; --purple:#8b7ad1; --fog:#d6d2e3; --fog-dim:#84809a; --line:#242038; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fog);font-family:Inter,system-ui,sans-serif;padding:40px 24px 80px;}
  h1{font-size:20px;margin-bottom:6px;color:#fff;}
  .lead{color:var(--fog-dim);font-size:14px;margin-bottom:32px;max-width:640px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;max-width:1180px;}
  .opt{background:linear-gradient(160deg,#1b1729,var(--panel));border:1px solid var(--line);border-radius:16px;padding:22px;}
  .opt.is-current{border-color:var(--signal-dim,#8f8534);}
  .label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.5px;color:var(--fog-dim);text-transform:uppercase;margin-bottom:16px;}
  .label b{color:#fff;font-family:Inter,sans-serif;font-size:14px;letter-spacing:0;text-transform:none;display:block;margin-bottom:2px;}
  .hero-row{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .hero-row svg{width:76px;height:76px;flex:none;filter:drop-shadow(0 6px 18px rgba(139,122,209,.28));}
  .wordmark{font-family:'Archivo Black',Impact,sans-serif;font-size:23px;color:#fff;text-transform:lowercase;line-height:1;}
  .sizes{display:flex;align-items:flex-end;gap:14px;padding-top:14px;border-top:1px solid var(--line);}
  .sizes figure{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .sizes svg{display:block;}
  .sizes figcaption{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#5a5670;}
  .note{margin-top:34px;font-size:13px;color:var(--fog-dim);max-width:640px;border-left:2px solid var(--line);padding-left:14px;}
</style>
</head>
<body>
<h1>Goodblox — logo directions</h1>
<p class="lead">כל אפשרות מוצגת בגודל גדול ובגדלים אמיתיים של אייקון (48 / 32 / 16px). מה שנשאר קריא ב-16px הוא מה שעובד בגוגל ובלשונית הדפדפן.</p>
<div class="grid" id="grid"></div>
<p class="note">תגידו מספר (או "1 עם הצבע של 3") ואחבר אותו לאתר ולכל האייקונים.</p>

<script>
const grad = (id) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7ad1"/><stop offset="1" stop-color="#5b4bb0"/></linearGradient></defs>`;
const tile = (id, fill='url(#'+id+')', stroke='none', sw=0) =>
  `<rect x="3" y="3" width="58" height="58" rx="17" fill="${fill}"${stroke!=='none'?` stroke="${stroke}" stroke-width="${sw}"`:''}/>`;

const OPTIONS = [
  {
    id:'bars', name:'Signal Bars', hint:'מריצים על המוטיב של פסי הסיגנל שכבר קיים בכרטיסים',
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id)}
      <g fill="#f4e04d">
        <rect x="13" y="36" width="7" height="16" rx="3.5"/>
        <rect x="23" y="30" width="7" height="22" rx="3.5"/>
        <rect x="33" y="22" width="7" height="30" rx="3.5"/>
        <rect x="43" y="14" width="7" height="38" rx="3.5"/>
      </g></svg>`
  },
  {
    id:'cube', name:'Blox Cube', hint:'קוביית blox איזומטרית — "משחק" בלי להיות גנרי',
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id, '#14111f', '#8b7ad1', 2)}
      <polygon points="32,12 50,21 32,30 14,21" fill="#f4e04d"/>
      <polygon points="14,21 32,30 32,50 14,41" fill="url(#${id})"/>
      <polygon points="50,21 32,30 32,50 50,41" fill="#5b4bb0"/>
      </svg>`
  },
  {
    id:'check', name:'Dark Check', hint:'הנוכחי אבל הפוך — אריח כהה ו-✓ צהוב. שקט ונקי',
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id, '#14111f', '#8b7ad1', 2)}
      <path d="M19 33.5 L27.5 42 L45 22" fill="none" stroke="#f4e04d" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`
  },
  {
    id:'play', name:'Play Tile', hint:'משולש play — "Play something good". הכי ברור במשחקים',
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id)}
      <path d="M27 21 L45 32 L27 43 Z" fill="#f4e04d" stroke="#f4e04d" stroke-width="7" stroke-linejoin="round"/>
      </svg>`
  },
  {
    id:'dot', name:'Signal Dot', hint:'הנקודה הפועמת מה-header כאייקון — מינימלי, מזוהה',
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id, '#14111f', '#8b7ad1', 2)}
      <circle cx="32" cy="32" r="19" fill="none" stroke="#f4e04d" stroke-opacity=".32" stroke-width="3"/>
      <circle cx="32" cy="32" r="12.5" fill="#f4e04d"/>
      </svg>`
  },
  {
    id:'current', name:'Current (for reference)', hint:'הגרסה הקודמת — סגול עם ✓ כהה', current:true,
    svg:(id)=>`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">${grad(id)}
      ${tile(id)}
      <path d="M19 33.5 L27.5 42 L45 22" fill="none" stroke="#0a0912" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="49" cy="15" r="5.5" fill="#f4e04d"/>
      </svg>`
  }
];

const grid = document.getElementById('grid');
let n = 0;
for(const opt of OPTIONS){
  const sizes = [48, 32, 16].map(size => {
    const inner = opt.svg(`g${n}_${size}`).replace('<svg ', `<svg width="${size}" height="${size}" `);
    return `<figure>${inner}<figcaption>${size}px</figcaption></figure>`;
  }).join('');
  const el = document.createElement('div');
  el.className = 'opt' + (opt.current ? ' is-current' : '');
  el.innerHTML = `
    <div class="label"><b>${opt.name}</b>${opt.hint}</div>
    <div class="hero-row">${opt.svg(`g${n}_hero`)}<span class="wordmark">goodblox</span></div>
    <div class="sizes">${sizes}</div>`;
  grid.appendChild(el);
  n++;
}
</script>
</body>
</html>
