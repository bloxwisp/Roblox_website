<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goodblox — premium directions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08080c; --line:#1e1e26; --fog:#e8e8ee; --dim:#767682; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(1100px 600px at 50% -20%,rgba(120,110,255,.10),transparent 65%),var(--bg);
       color:var(--fog);font-family:Inter,system-ui,sans-serif;padding:56px 24px 100px;min-height:100vh;}
  .head{text-align:center;margin-bottom:52px;}
  h1{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.4px;margin-bottom:10px;}
  .lead{color:var(--dim);font-size:14.5px;max-width:600px;margin:0 auto;line-height:1.65;}

  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px;max-width:1340px;margin:0 auto;}
  .card{background:#0f0f15;border:1px solid var(--line);border-radius:20px;padding:32px 28px 24px;position:relative;overflow:hidden;transition:border-color .25s;}
  .card:hover{border-color:#33333f;}
  .glow{position:absolute;top:-90px;left:50%;transform:translateX(-50%);width:260px;height:180px;border-radius:50%;filter:blur(60px);opacity:.28;background:var(--g);pointer-events:none;}
  .num{position:absolute;top:18px;right:20px;font-size:11px;font-weight:600;color:#4a4a56;letter-spacing:1px;}
  .hero{display:flex;align-items:center;gap:18px;position:relative;margin-bottom:26px;}
  .hero svg{width:78px;height:78px;flex:none;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5));}
  .wm{font-size:30px;font-weight:800;letter-spacing:-1.1px;line-height:1;}
  .meta{margin-top:4px;}
  .name{font-size:13.5px;font-weight:600;color:#fff;}
  .desc{font-size:12px;color:var(--dim);line-height:1.55;margin-top:3px;max-width:240px;}

  .strip{display:flex;align-items:flex-end;gap:18px;padding-top:22px;margin-top:22px;border-top:1px solid var(--line);}
  .strip figure{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .strip figcaption{font-size:9px;color:#55555f;letter-spacing:.4px;}
  .ctx{display:flex;gap:12px;align-items:center;margin-top:20px;}
  .sq{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .sq.w{background:#fff;} .sq.b{background:#000;border:1px solid #202028;}
  .sq svg{width:36px;height:36px;}
  .tab{display:flex;align-items:center;gap:8px;background:#242430;border-radius:8px 8px 0 0;padding:9px 16px 9px 11px;font-size:12.5px;font-weight:500;color:#e8e8ee;}
  .tab svg{width:16px;height:16px;}
  .pick{margin-top:22px;width:100%;font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.2px;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.025);color:var(--fog);cursor:pointer;transition:.2s;}
  .pick:hover{border-color:#fff;background:rgba(255,255,255,.07);color:#fff;}
  .note{margin:52px auto 0;font-size:13px;color:var(--dim);max-width:620px;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="head">
  <h1>Goodblox — premium directions</h1>
  <p class="lead">חמישה כיוונים בוגרים: מרקים גיאומטריים מעודנים, גרדיאנטים עשירים ושקטים, וטיפוגרפיה חדה. כל אחד מוצג בגודל מלא, כאייקון 48/32/16px, על לבן ושחור, וכטאב דפדפן.</p>
</div>
<div class="row" id="row"></div>
<p class="note">תגידו מספר — ואחבר אותו ל-header, לכל האייקונים, ל-favicon ולגוגל.</p>

<script>
/* ---------- helpers ---------- */
const stops = arr => arr.map(([o,c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
const gradDef = (uid, arr, x1='0', y1='0', x2='1', y2='1') =>
  `<linearGradient id="g-${uid}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${stops(arr)}</linearGradient>`;
const gloss = (uid) => `<radialGradient id="gl-${uid}" cx=".32" cy=".16" r="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".55" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>`;
const bevel = (uid) => `<linearGradient id="bv-${uid}" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
</linearGradient>`;

/* ---------- marks ---------- */
const MARKS = {
  /* Refined "G" — arc + crossbar, cut from a squircle */
  g: (p, uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>${gradDef(uid,p.grad)}${gloss(uid)}${bevel(uid)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g-${uid})"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gl-${uid})"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.4" fill="none" stroke="url(#bv-${uid})" stroke-width="1.5"/>
    <path d="M42 22.5 A16 16 0 1 0 42 42.5 L42 34 L32 34" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`,

  /* Single architectural blade / upward stroke */
  blade: (p, uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>${gradDef(uid,p.grad)}${gloss(uid)}${bevel(uid)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0e0e14"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gl-${uid})" opacity=".6"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.4" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M18 46 L32 16 L46 46" fill="none" stroke="url(#g-${uid})" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24.5 36.5 L39.5 36.5" stroke="url(#g-${uid})" stroke-width="6" stroke-linecap="round"/>
  </svg>`,

  /* Layered blocks — abstract "curated stack" */
  stack: (p, uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>${gradDef(uid,p.grad)}${gloss(uid)}${bevel(uid)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0e0e14"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gl-${uid})" opacity=".6"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.4" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.5"/>
    <rect x="28" y="13" width="23" height="23" rx="6" fill="url(#g-${uid})" opacity=".55"/>
    <rect x="20" y="21" width="23" height="23" rx="6" fill="url(#g-${uid})" opacity=".8"/>
    <rect x="12" y="29" width="23" height="23" rx="6" fill="url(#g-${uid})"/>
  </svg>`,

  /* Minimal play — rounded triangle, single tone */
  play: (p, uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>${gradDef(uid,p.grad)}${gloss(uid)}${bevel(uid)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#g-${uid})"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gl-${uid})"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.4" fill="none" stroke="url(#bv-${uid})" stroke-width="1.5"/>
    <path d="M26 19 L47 32 L26 45 Z" fill="#0a0a10" fill-opacity=".88" stroke="#0a0a10" stroke-width="4" stroke-linejoin="round"/>
  </svg>`,

  /* Monogram GB */
  gb: (p, uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>${gradDef(uid,p.grad)}${gloss(uid)}${bevel(uid)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0e0e14"/>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#gl-${uid})" opacity=".6"/>
    <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.4" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="1.5"/>
    <path d="M30 22.5 A11 11 0 1 0 30 41.5 L30 33 L23 33" fill="none" stroke="url(#g-${uid})" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 21 L44 43 M44 21 L52 21 A5.5 5.5 0 0 1 52 32 L44 32 M44 32 L53 32 A5.5 5.5 0 0 1 53 43 L44 43" fill="none" stroke="url(#g-${uid})" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".75"/>
  </svg>`,
};

/* ---------- premium palettes (rich, not childlike) ---------- */
const P = {
  indigo: { grad:[[0,'#6d6bff'],[1,'#a259ff']], wm:['#8b8bff','#b98aff'] },
  teal:   { grad:[[0,'#0f9b9b'],[1,'#22d3ee']], wm:['#3ec9c9','#5fe0f0'] },
  violet: { grad:[[0,'#7c3aed'],[1,'#ec4899']], wm:['#a06bff','#ff8ec4'] },
  lime:   { grad:[[0,'#a3e635'],[1,'#22c55e']], wm:['#c7f06b','#5be08a'] },
  gold:   { grad:[[0,'#f5d27a'],[.5,'#c9a24a'],[1,'#8a6d2f']], wm:['#f0d78e','#c9a24a'] },
  chrome: { grad:[[0,'#ffffff'],[.45,'#c7cfdd'],[1,'#8892a6']], wm:['#f3f6fb','#c2cbd9'] },
};

const OPTIONS = [
  { mark:'g',     pal:'indigo', name:'Monogram — Indigo',    desc:'אות G עדינה בסקוורקל עם גרדיאנט אינדיגו→סגול. נקי, פרימיום, תחושת מוצר.' },
  { mark:'blade', pal:'teal',   name:'Blade — Deep Teal',    desc:'סמל חד גיאומטרי על שחור עם גרדיאנט טורקיז עמוק. בוגר ומינימלי.' },
  { mark:'stack', pal:'violet', name:'Stack — Violet',       desc:'שכבות חופפות — "נבחר בקפידה". מופשט, אלגנטי, ייחודי.' },
  { mark:'gb',    pal:'gold',   name:'Monogram GB — Gold',   desc:'מונוגרמה GB בגרדיאנט זהב מתכתי על שחור. יוקרתי.' },
  { mark:'play',  pal:'chrome', name:'Play — Chrome',        desc:'משולש play מינימלי בגרדיאנט כרום/כסף. חד ומודרני.' },
];

let uid = 0;
const nid = () => 'p' + (uid++);
const render = opt => MARKS[opt.mark](P[opt.pal], nid());
const sized = (opt, size) => render(opt).replace('<svg ', `<svg width="${size}" height="${size}" `);

document.getElementById('row').innerHTML = OPTIONS.map((o, i) => {
  const pal = P[o.pal];
  return `
  <div class="card" style="--g:linear-gradient(135deg,${pal.grad[0][1]},${pal.grad[pal.grad.length-1][1]})">
    <div class="glow"></div>
    <span class="num">0${i+1}</span>
    <div class="hero">
      ${render(o)}
      <div class="meta">
        <div class="wm" style="background:linear-gradient(100deg,${pal.wm[0]},${pal.wm[1]});-webkit-background-clip:text;background-clip:text;color:transparent">goodblox</div>
        <div class="name" style="margin-top:8px">${o.name}</div>
      </div>
    </div>
    <div class="desc">${o.desc}</div>
    <div class="strip">
      ${[48,32,16].map(s => `<figure>${sized(o,s)}<figcaption>${s}px</figcaption></figure>`).join('')}
    </div>
    <div class="ctx">
      <span class="sq w">${sized(o,36)}</span>
      <span class="sq b">${sized(o,36)}</span>
      <span class="tab">${sized(o,16)}Goodblox</span>
    </div>
    <button class="pick" data-pick="${i}">בחר את ${o.name}</button>
  </div>`;
}).join('');

document.getElementById('row').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b) alert('בחרת: ' + OPTIONS[b.dataset.pick].name);
});
</script>
</body>
</html>
