name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` turns Pages on for this repo if it is not enabled yet,
      # so no manual visit to repo Settings is required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Publish the site root, minus the git objects.
      - name: Stage site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./_site -cf - . | tar -xf - -C _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
