<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goodblox — logo gallery</title>
<style>
  :root{ --bg:#07060d; --line:#241f38; --fog:#e4e0ef; --dim:#807a99; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(900px 500px at 50% -10%,rgba(120,80,255,.16),transparent 70%),var(--bg);
       color:var(--fog);font-family:Inter,system-ui,sans-serif;padding:44px 24px 90px;min-height:100vh;}
  h1{font-size:24px;color:#fff;text-align:center;margin-bottom:6px;letter-spacing:-.3px;}
  .lead{color:var(--dim);font-size:14.5px;text-align:center;max-width:620px;margin:0 auto 40px;line-height:1.6;}

  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;max-width:1320px;margin:0 auto;}
  .card{background:linear-gradient(170deg,#171327,#0d0b16);border:1px solid var(--line);border-radius:24px;padding:28px 24px 24px;position:relative;overflow:hidden;}
  .card::before{content:"";position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:220px;height:160px;border-radius:50%;filter:blur(48px);opacity:.5;background:var(--glow);}
  .badge{position:absolute;top:16px;right:16px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.5px;color:var(--dim);border:1px solid var(--line);border-radius:100px;padding:4px 10px;}
  .hero{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;}
  .hero svg{width:132px;height:132px;filter:drop-shadow(0 16px 34px rgba(0,0,0,.55));transition:transform .35s cubic-bezier(.2,.8,.2,1);}
  .card:hover .hero svg{transform:translateY(-4px) scale(1.03);}
  .wm{font-family:'Archivo Black',Impact,sans-serif;font-size:27px;line-height:1;text-transform:lowercase;}
  .name{font-size:14.5px;font-weight:700;color:#fff;}
  .desc{font-size:12.5px;color:var(--dim);text-align:center;line-height:1.55;margin-top:2px;max-width:250px;}

  .sizes{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
  .sizes figure{display:flex;flex-direction:column;align-items:center;gap:7px;}
  .sizes figcaption{font-family:'IBM Plex Mono',monospace;font-size:9px;color:#56516e;}
  .ctx{display:flex;gap:14px;justify-content:center;margin-top:18px;}
  .ctx .sq{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;}
  .ctx .w{background:#fff;} .ctx .b{background:#000;border:1px solid #24242e;}
  .ctx .sq svg{width:38px;height:38px;}
  .tab{display:flex;align-items:center;gap:7px;background:#2c2c3c;border-radius:9px 9px 0 0;padding:9px 15px 9px 11px;font-size:12.5px;color:#eaeaf2;}
  .tab svg{width:16px;height:16px;}
  .pick{margin-top:20px;width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:11px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fog);cursor:pointer;transition:.2s;}
  .pick:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,.08);}
  .note{margin:44px auto 0;font-size:13px;color:var(--dim);max-width:640px;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<h1>Goodblox — לוגו יפה וצבעוני</h1>
<p class="lead">ארבע גרסאות מושקעות: גרדיאנטים עשירים רב-צבעיים, ברק זכוכית, עומק וניצוצות. כל אחת מוצגת גדול, בגודלי אייקון אמיתיים, על לבן ושחור, וכטאב דפדפן.</p>
<div class="row" id="row"></div>
<p class="note">תגידו איזו גרסה (או "2 עם הצבעים של 1") — ואחבר אותה ל-header, לכל האייקונים, ל-favicon ולגוגל.</p>

<script>
/* ============================================================
   Shared gradient helpers — richer multi-stop + gloss + edge
   ============================================================ */
const defs = (uid, stops, extra='') => `
  <linearGradient id="g-${uid}" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient>
  <radialGradient id="gloss-${uid}" cx=".3" cy=".18" r=".95">
    <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".06"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="edge-${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#000" stop-opacity=".28"/>
  </linearGradient>${extra}`;

const stopsOf = (arr) => arr.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');

/* sparkle = smooth 4-point star */
const sparklePath = (cx, cy, r, waist=0.32) =>
  `M${cx} ${cy-r} C${cx+r*waist} ${cy-r*waist} ${cx+r*waist} ${cy-r*waist} ${cx+r} ${cy}`
  + ` C${cx+r*waist} ${cy+r*waist} ${cx+r*waist} ${cy+r*waist} ${cx} ${cy+r}`
  + ` C${cx-r*waist} ${cy+r*waist} ${cx-r*waist} ${cy+r*waist} ${cx-r} ${cy}`
  + ` C${cx-r*waist} ${cy-r*waist} ${cx-r*waist} ${cy-r*waist} ${cx} ${cy-r} Z`;

/* ============================================================
   1 — AURORA SPARKLE  (sunrise → magenta → violet → blue)
   ============================================================ */
const auroraGradient = stopsOf([[0,'#ffc24b'],[.32,'#ff5b8a'],[.64,'#a558ff'],[1,'#3d6bff']]);
const MARK_AURORA = (uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>${defs(uid, auroraGradient)}</defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#g-${uid})"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#gloss-${uid})"/>
  <rect x="3" y="3" width="58" height="58" rx="16.5" fill="none" stroke="url(#edge-${uid})" stroke-width="2"/>
  <path d="${sparklePath(32,31.5,21)}" fill="#fff" fill-opacity=".96"/>
  <circle cx="45.5" cy="18.5" r="2.7" fill="#fff" fill-opacity=".85"/>
  <circle cx="19" cy="45.5" r="1.9" fill="#fff" fill-opacity=".7"/>
</svg>`;

/* ============================================================
   2 — RAINBOW GEM  (glossy faceted crystal, full spectrum)
   ============================================================ */
const gemGradient = stopsOf([[0,'#ff7ac6'],[.28,'#ffd166'],[.55,'#5ee6a8'],[.8,'#5ca8ff'],[1,'#a78bfa']]);
const MARK_GEM = (uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    ${defs(uid, gemGradient, `
      <linearGradient id="ring-${uid}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7ac6"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#5ca8ff"/>
      </linearGradient>`)}
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#100d1c"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#gloss-${uid})" opacity=".4"/>
  <rect x="3" y="3" width="58" height="58" rx="16.5" fill="none" stroke="url(#ring-${uid})" stroke-width="2" stroke-opacity=".55"/>
  <g transform="translate(0,-1)">
    <polygon points="32,7 50,22 44,50 20,50 14,22" fill="url(#g-${uid})"/>
    <polygon points="22,17 42,17 32,28" fill="#fff" fill-opacity=".42"/>
    <polygon points="14,22 32,28 32,50 20,50" fill="#fff" fill-opacity=".14"/>
    <polygon points="50,22 32,28 32,50 44,50" fill="#000" fill-opacity=".20"/>
    <polyline points="14,22 22,17 42,17 50,22" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.4"/>
    <polyline points="22,17 32,28 42,17" fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="1.2"/>
    <polyline points="14,22 32,28 50,22" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2"/>
    <polyline points="20,50 32,28 44,50" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1.2"/>
  </g>
  <path d="${sparklePath(48.5,14.5,6)}" fill="#fff" fill-opacity=".95"/>
  <path d="${sparklePath(15.5,48,4)}" fill="#fff" fill-opacity=".7"/>
</svg>`;

/* ============================================================
   3 — SUNSET PLANET  (glossy orb + ring, starfield)
   ============================================================ */
const sunsetGradient = stopsOf([[0,'#ffe27a'],[.35,'#ff9a3c'],[.7,'#ff3d81'],[1,'#8a2be2']]);
const MARK_PLANET = (uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    ${defs(uid, sunsetGradient, `
      <radialGradient id="shadow-${uid}" cx=".72" cy=".78" r=".8">
        <stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="ringg-${uid}" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff5b8a"/><stop offset="1" stop-color="#a558ff"/>
      </linearGradient>`)}
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#0b0a16"/>
  <rect x="3" y="3" width="58" height="58" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="42" cy="14" r="1.1" fill="#fff" fill-opacity=".8"/><circle cx="17" cy="18" r="1.4" fill="#fff" fill-opacity=".65"/>
  <circle cx="51" cy="34" r="1" fill="#fff" fill-opacity=".7"/><circle cx="14" cy="41" r="1.2" fill="#fff" fill-opacity=".6"/>
  <circle cx="32" cy="33" r="17.5" fill="url(#g-${uid})"/>
  <circle cx="32" cy="33" r="17.5" fill="url(#shadow-${uid})"/>
  <ellipse cx="25.5" cy="25" rx="6.5" ry="4.4" fill="#fff" fill-opacity=".38" transform="rotate(-28 25.5 25)"/>
  <g transform="rotate(-22 32 33)">
    <ellipse cx="32" cy="33" rx="27" ry="8.5" fill="none" stroke="url(#ringg-${uid})" stroke-width="3.2" stroke-opacity=".95"/>
  </g>
</svg>`;

/* ============================================================
   4 — PRISM CUBE  (glossy isometric blox, rainbow faces)
   ============================================================ */
const cubeGradient = stopsOf([[0,'#7cf0ff'],[.4,'#6a8bff'],[1,'#a65bff']]);
const MARK_CUBE = (uid) => `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>${defs(uid, cubeGradient, `
    <linearGradient id="top-${uid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9d6"/><stop offset=".45" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7ac6"/>
    </linearGradient>
    <linearGradient id="right-${uid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b8a"/><stop offset="1" stop-color="#a558ff"/>
    </linearGradient>`)}
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#0e0c1a"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#gloss-${uid})" opacity=".35"/>
  <rect x="3" y="3" width="58" height="58" rx="16.5" fill="none" stroke="url(#g-${uid})" stroke-width="2" stroke-opacity=".5"/>
  <g stroke="#0e0c1a" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="32,10 52,21 32,32 12,21" fill="url(#top-${uid})"/>
    <polygon points="12,21 32,32 32,53 12,42" fill="url(#g-${uid})"/>
    <polygon points="52,21 32,32 32,53 52,42" fill="url(#right-${uid})"/>
  </g>
  <polygon points="14,22 32,31.5 32,34 14,24.5" fill="#fff" fill-opacity=".55"/>
  <polygon points="50,24 34,32.5 34,35 50,26.5" fill="#000" fill-opacity=".18"/>
  <path d="${sparklePath(49.5,14,5.5)}" fill="#fff" fill-opacity=".9"/>
</svg>`;

/* ============================================================ */
const OPTIONS = [
  { name:'Aurora Sparkle', wm:['#ff9a3c','#a558ff'], glow:'linear-gradient(135deg,#ff5b8a,#a558ff)', svg:MARK_AURORA,
    desc:'גרדיאנט זריחה→סגול, ברק זכוכית וניצוץ לבן. חם, עשיר ומזוהה ב-16px.' },
  { name:'Rainbow Gem', wm:['#ff7ac6','#5ca8ff'], glow:'linear-gradient(135deg,#ffd166,#5ca8ff)', svg:MARK_GEM,
    desc:'יהלום מלוטש עם כל הספקטרום על רקע כהה. יוקרתי ובולט.' },
  { name:'Sunset Planet', wm:['#ff9a3c','#ff3d81'], glow:'linear-gradient(135deg,#ff9a3c,#8a2be2)', svg:MARK_PLANET,
    desc:'כוכב לכת מבריק עם טבעת, על שדה כוכבים. רגוע ויפה.' },
  { name:'Prism Cube', wm:['#6a8bff','#ff5b8a'], glow:'linear-gradient(135deg,#6a8bff,#a65bff)', svg:MARK_CUBE,
    desc:'קוביית blox זכוכיתית תלת-ממדית עם פאות צבעוניות וברק.' },
];

let uid = 0;
const nid = () => 's' + (uid++);
const sized = (mark, size) => mark(nid()).replace('<svg ', `<svg width="${size}" height="${size}" `);

document.getElementById('row').innerHTML = OPTIONS.map((o, i) => `
  <div class="card" style="--glow:${o.glow}">
    <span class="badge">0${i+1}</span>
    <div class="hero">
      ${o.svg(nid())}
      <span class="wm" style="background:linear-gradient(100deg,${o.wm[0]},${o.wm[1]});-webkit-background-clip:text;background-clip:text;color:transparent">goodblox</span>
      <div class="name">${o.name}</div>
      <div class="desc">${o.desc}</div>
    </div>
    <div class="sizes">
      ${[48,32,16].map(s => `<figure>${sized(o.svg,s)}<figcaption>${s}px</figcaption></figure>`).join('')}
    </div>
    <div class="ctx">
      <span class="sq w">${sized(o.svg,38)}</span>
      <span class="sq b">${sized(o.svg,38)}</span>
      <span class="tab">${sized(o.svg,16)}Goodblox</span>
    </div>
    <button class="pick" data-pick="${i}">בחר את ${o.name}</button>
  </div>
`).join('');

document.getElementById('row').addEventListener('click', e => {
  const b = e.target.closest('[data-pick]');
  if (b) alert('בחרת: ' + OPTIONS[b.dataset.pick].name);
});
</script>
</body>
</html>
