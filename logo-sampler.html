<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goodblox — style sampler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#08080c; --card:#0f0f15; --line:#1f1f27; --fog:#e8e8ee; --dim:#767682; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--fog);font-family:Inter,system-ui,sans-serif;padding:48px 24px 80px;}
  .head{text-align:center;margin-bottom:40px;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.4px;color:#fff;margin-bottom:8px;}
  .lead{color:var(--dim);font-size:14px;max-width:600px;margin:0 auto;line-height:1.6;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1180px;margin:0 auto;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:.2s;position:relative;}
  .tile:hover{border-color:#3a3a48;transform:translateY(-3px);}
  .tile.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.15);}
  .tile .num{position:absolute;top:10px;left:12px;font-size:10px;font-weight:700;color:#45454f;letter-spacing:.5px;}
  .tile svg{width:72px;height:72px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.45));}
  .tile .nm{font-size:12.5px;font-weight:600;color:#fff;text-align:center;}
  .tile .ds{font-size:10.5px;color:var(--dim);text-align:center;line-height:1.45;}
  .tile .ex{font-size:14px;font-weight:800;letter-spacing:-.4px;color:#fff;}
  .note{margin:44px auto 0;font-size:13px;color:var(--dim);max-width:640px;text-align:center;line-height:1.7;}
</style>
</head>
<body>
<div class="head">
  <h1>Goodblox — style sampler</h1>
  <p class="lead">12 שפות עיצוב שונות. תסתכל ותגיד מספר — זה הרבה יותר מהיר מלתאר. אפשר גם לצרף מותג שאתה אוהב ("כמו Discord").</p>
</div>
<div class="grid" id="grid"></div>
<p class="note">לחץ על tile כדי לסמן, או פשוט תגיד לי מספר בצ'אט.</p>

<script>
/* ---------- primitives ---------- */
const lg = (uid, arr, x1='0', y1='0', x2='1', y2='1') =>
  `<linearGradient id="g${uid}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${arr.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
const rg = (uid, arr, cx='.35', cy='.25', r='1') =>
  `<radialGradient id="r${uid}" cx="${cx}" cy="${cy}" r="${r}">${arr.map(([o,c])=>`<stop offset="${o}" stop-color="${c}"/>`).join('')}</radialGradient>`;
const blur = (uid, amt=3) => `<filter id="b${uid}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${amt}"/></filter>`;

/* ---------- 12 styles ---------- */
const STYLES = [
{ n:'Bauhaus', d:'גיאומטריה בולטת, בסיס+עיגול+חצי', ex:'g',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#ff6b4a'],[1,'#ff3d6e']])}${lg(u+'_2',[[0,'#4da3ff'],[1,'#6d6bff']])}${lg(u+'_3',[[0,'#ffd166'],[1,'#ff9a3c']])}</defs>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#111119"/>
    <rect x="12" y="34" width="18" height="18" rx="4" fill="url(#g${u})"/>
    <circle cx="45" cy="25" r="10" fill="url(#g${u}_2)"/>
    <path d="M12 30 A10 10 0 0 1 32 30 Z" fill="url(#g${u}_3)"/></svg>`},

{ n:'Soft 3D', d:'רך, מבריק, תחושת אפליקציה', ex:'b',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#7c6bff'],[1,'#4a2fd6']])}${rg(u+'_h',[[0,'#ffffff','']],'.34','.22','.9')}${rg(u+'_s',[[0,'#000']],'.72','.85','.8')}</defs>
    <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#g${u})"/>
    <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#r${u}_h)" fill-opacity=".45"/>
    <rect x="2" y="2" width="60" height="60" rx="20" fill="url(#r${u}_s)" fill-opacity=".28"/>
    <path d="M36 15 C22 15 15 25 15 32 C15 39 22 49 36 49" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-opacity=".95"/></svg>`},

{ n:'Esports', d:'חד, זוויתי, אנרגטי', ex:'E',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#00e5ff'],[1,'#0066ff']])}</defs>
    <path d="M32 4 L56 16 V36 L32 60 L8 36 V16 Z" fill="#0d0d15" stroke="url(#g${u})" stroke-width="3"/>
    <path d="M34 14 L22 36 H31 L28 50 L44 26 H34 Z" fill="url(#g${u})"/></svg>`},

{ n:'Line Art', d:'קו דק, מינימלי, מעודן', ex:'L',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#a78bfa'],[1,'#60a5fa']])}</defs>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#g${u})" stroke-width="2" stroke-opacity=".5"/>
    <path d="M18 44 L32 16 L46 44 M24 34 H40" fill="none" stroke="url(#g${u})" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`},

{ n:'Organic', d:'צורה אורגנית, רכה, זורמת', ex:'O',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${rg(u,[[0,'#ff9a3c'],[.5,'#ff3d81'],[1,'#8a2be2']],'.4','.35','.9')}</defs>
    <path d="M32 6 C46 6 58 14 58 30 C58 46 48 58 32 58 C18 58 6 48 6 34 C6 18 18 6 32 6 Z" fill="url(#r${u})"/>
    <circle cx="24" cy="24" r="7" fill="#fff" fill-opacity=".3"/></svg>`},

{ n:'Glass', d:'זכוכית מט, שכבות שקופות', ex:'Gl',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#8affff'],[1,'#5b6bff']])}${blur(u,2)}</defs>
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#141420"/>
    <g filter="url(#b${u})" opacity=".95">
      <rect x="12" y="16" width="30" height="30" rx="9" fill="url(#g${u})" fill-opacity=".55"/>
      <rect x="22" y="20" width="30" height="30" rx="9" fill="#fff" fill-opacity=".18"/>
    </g>
    <rect x="22" y="20" width="30" height="30" rx="9" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.2"/></svg>`},

{ n:'Terminal', d:'רטרו-מודרני, חד', ex:'>_',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#5ee6a8'],[1,'#22c55e']])}</defs>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b0f0d"/>
    <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#g${u})" stroke-width="2" stroke-opacity=".4"/>
    <path d="M16 22 L26 32 L16 42" fill="none" stroke="url(#g${u})" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="34" y="38" width="16" height="4" rx="2" fill="url(#g${u})"/></svg>`},

{ n:'Serif', d:'אלגנטי, מגזיני, יוקרתי', ex:'G',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#f5e9c8'],[.5,'#d9b968'],[1,'#a8863c']])}</defs>
    <rect x="2" y="2" width="60" height="60" rx="10" fill="#0d0b09"/>
    <text x="32" y="47" text-anchor="middle" font-family="'Playfair Display',serif" font-weight="900" font-size="44" fill="url(#g${u})">G</text></svg>`},

{ n:'Voxel', d:'קוביות תלת-ממד, משחקי-אבל-נקי', ex:'V',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#7cc9ff'],[1,'#3b7bff']])}${lg(u+'_t',[[0,'#d6ecff'],[1,'#8fc4ff']])}${lg(u+'_r',[[0,'#3b7bff'],[1,'#2547c9']])}</defs>
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#0d1017"/>
    <polygon points="32,14 46,22 32,30 18,22" fill="url(#g${u}_t)"/>
    <polygon points="18,22 32,30 32,48 18,40" fill="url(#g${u})"/>
    <polygon points="46,22 32,30 32,48 46,40" fill="url(#g${u}_r)"/></svg>`},

{ n:'Mesh', d:'גרדיאנט רך, מודרני-טק', ex:'M',
  s:u=>`<svg viewBox="0 0 64 64"><defs>
    <radialGradient id="m${u}a" cx=".3" cy=".3" r=".85"><stop offset="0" stop-color="#ff7ac6"/><stop offset="1" stop-color="#ff7ac6" stop-opacity="0"/></radialGradient>
    <radialGradient id="m${u}b" cx=".74" cy=".28" r=".85"><stop offset="0" stop-color="#5cc8ff"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="m${u}c" cx=".5" cy=".8" r=".85"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="18" fill="#0c0c14"/>
    <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#m${u}a)"/>
    <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#m${u}b)"/>
    <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#m${u}c)"/>
    <rect x="2" y="2" width="60" height="60" rx="18" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/></svg>`},

{ n:'Crest', d:'מגן/תג, תחושת מועדון', ex:'C',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#f0d78e'],[1,'#c9a24a']])}</defs>
    <path d="M32 4 L54 13 V33 C54 46 44 56 32 61 C20 56 10 46 10 33 V13 Z" fill="#0d0d15" stroke="url(#g${u})" stroke-width="2.5"/>
    <path d="M22 26 L32 20 L42 26 L32 32 Z" fill="url(#g${u})"/>
    <path d="M32 34 L42 28 V38 L32 44 L22 38 V28 Z" fill="url(#g${u})" fill-opacity=".65"/></svg>`},

{ n:'Energy', d:'ברק חד, דינמי, חדשני', ex:'Z',
  s:u=>`<svg viewBox="0 0 64 64"><defs>${lg(u,[[0,'#ffe066'],[.5,'#ff9a3c'],[1,'#ff3d6e']])}</defs>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="#0e0c14"/>
    <path d="M37 6 L15 36 H29 L26 58 L49 26 H34 Z" fill="url(#g${u})"/></svg>`},
];

let uid = 0;
document.getElementById('grid').innerHTML = STYLES.map((st, i) => `
  <div class="tile" data-i="${i}">
    <span class="num">${String(i+1).padStart(2,'0')}</span>
    ${st.s('x' + (uid++))}
    <span class="ex">${st.ex}</span>
    <span class="nm">${st.n}</span>
    <span class="ds">${st.d}</span>
  </div>`).join('');

document.getElementById('grid').addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (!t) return;
  document.querySelectorAll('.tile').forEach(x => x.classList.remove('sel'));
  t.classList.add('sel');
});
</script>
</body>
</html>
